name: Acquire and validate official public-source data (manual)
on:
  workflow_dispatch:
    inputs:
      acquire_cps:
        type: boolean
        description: 'Also replay the 2026 Census CPS ASEC household income benchmark'
        default: false
      acquire_cms:
        type: boolean
        description: 'Also attempt CMS Medicare trustees expanded ZIP'
        default: false
      acquire_irs:
        type: boolean
        description: 'Also attempt large public IRS geographic AGI aggregates'
        default: false
permissions:
  contents: read
jobs:
  official-public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: fiscalrazor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile original February 2026 CBO files and verify the published receipt
        working-directory: .
        run: |
          python scripts/replay_cbo_originals.py --output cbo_replay.json
          cmp cbo_replay.json publication/results/cbo_2026_original_source_replay.json
      - name: Fetch the Census CPS ASEC CSV archive with replicate weights
        if: ${{ inputs.acquire_cps }}
        run: python scripts/acquire_real_federal_v08.py --id cps_asec_2026_csv
      - name: Rebuild the Census household-income receipt
        if: ${{ inputs.acquire_cps }}
        working-directory: .
        run: |
          python scripts/replay_cps_households.py fiscalrazor/data/raw/v08_official_origins/cps_asec_2026_csv.zip --output cps_replay.json
          cmp cps_replay.json publication/results/cps_asec_2026_household_income_replay.json
      - name: Fetch CMS public tables
        if: ${{ inputs.acquire_cms }}
        run: python scripts/acquire_real_federal_v08.py --id cms_medicare_2026_expanded
      - name: Fetch IRS aggregate public file
        if: ${{ inputs.acquire_irs }}
        run: python scripts/acquire_real_federal_v08.py --id irs_soi_2023_zip_agi
      - name: Upload available public-source receipts and CBO-derived results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiscalrazor-cbo-public-evidence
          path: |
            cbo_replay.json
            cps_replay.json
            fiscalrazor/data/raw/v08_official_origins/*.origin.json
            fiscalrazor/results/v08/original_sources_status.json
          retention-days: 7
          if-no-files-found: warn
