name: FiscalRazor reproducibility and evidence gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install preserved public-scoring test parser dependency
        run: python -m pip install beautifulsoup4==4.14.3
      - name: Verify immutable v1.1 source archive
        working-directory: fiscalrazor
        run: python scripts/verify_manifest_v11.py
      - name: Test original fiscal system
        working-directory: fiscalrazor
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -q
      - name: Test preserved public-scoring suite
        working-directory: fiscalrazor/external/public_scoring
        run: python -m unittest discover -s tests -q
      - name: Test research-publication calculations
        run: python -m unittest discover -s publication/tests -q
      - name: Check documentary publication boundaries
        run: python scripts/verify_publication.py
      - name: Rebuild exact CBO reference table
        run: python scripts/build_publication.py
